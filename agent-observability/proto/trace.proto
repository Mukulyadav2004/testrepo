syntax = "proto3";

package agentobs;

// A single trace emitted by an instrumented AI application.
message Trace {
  string trace_id = 1;
  string session_id = 2;
  string app_name = 3;
  int64 timestamp = 4;        // Unix epoch milliseconds
  string input = 5;
  string output = 6;
  double latency_ms = 7;
  string model_name = 8;
  int32 token_count = 9;
}

// A discrete event that occurred within a trace (e.g. tool call, llm call).
message SpanEvent {
  string span_id = 1;
  string trace_id = 2;
  string event_type = 3;
  int64 timestamp = 4;        // Unix epoch milliseconds
  map<string, string> metadata = 5;
}

// Request wrapping a single trace and all of its span events.
message IngestTraceRequest {
  Trace trace = 1;
  repeated SpanEvent span_events = 2;
}

// Response acknowledging ingestion.
message IngestTraceResponse {
  bool success = 1;
  string message = 2;
}

// Service exposed by the gRPC ingestion server.
service TraceIngestionService {
  rpc IngestTrace(IngestTraceRequest) returns (IngestTraceResponse);
}
