apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: observability
type: Opaque
stringData:
  # Async driver URL: the worker (SQLAlchemy async engine) needs the +asyncpg suffix,
  # and the api-server strips it for asyncpg. See k8s/README.md for the evaluator caveat.
  DATABASE_URL: "postgresql+asyncpg://agentobs:agentobs@postgres:5432/agentobs"
